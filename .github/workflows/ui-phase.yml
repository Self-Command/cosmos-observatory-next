name: UI and performance iteration
on:
  workflow_dispatch:
    inputs:
      spec:
        type: choice
        default: all
        options: [all, visual, focus]
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}-${{ inputs.spec || 'all' }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
        if: inputs.spec != 'visual' && inputs.spec != 'focus'
      - run: npm run browser -- tests/browser/visual-review.spec.ts
        if: inputs.spec == 'visual'
      - run: npm run browser -- tests/browser/ui-focus.spec.ts
        if: inputs.spec == 'focus'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-images-and-metrics
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.md
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: ui-mouse-videos, path: 'test-results/**/*.webm', retention-days: 2}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-00
          path: 'test-results/**/*settings-世界*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-01
          path: 'test-results/**/*settings-文件节点*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-02
          path: 'test-results/**/*settings-镜头与性能*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-03
          path: 'test-results/**/*settings-引力*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-04
          path: 'test-results/**/*settings-关系*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-05
          path: 'test-results/**/*settings-背景*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-06
          path: 'test-results/**/*settings-蜘蛛与巡查*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-07
          path: 'test-results/**/*settings-仓库监听*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-settings-08
          path: 'test-results/**/*settings-模型与扩展*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
