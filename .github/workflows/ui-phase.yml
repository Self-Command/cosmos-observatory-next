            test-results/**/narrow-large-search.png
            test-results/**/narrow-large-select.png
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-evidence
          path: |
            test-results/**/events-full.png
            test-results/**/event-evidence.png
            test-results/**/coverage-*.png
            test-results/**/heat-cell-events.png
            test-results/**/*panel-menu.png
            test-results/**/panel-tooltip.png
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-review-metrics
          path: |
            test-results/**/visual-surface-inventory.json
            test-results/**/every-setting-control.json
            test-results/**/high-dpi-file-actions.json
            test-results/**/ui-focus.json
          retention-days: 2
