name: Default performance iteration
on:
  workflow_dispatch:
    inputs:
      spec:
        type: choice
        default: performance
        options: [performance, render-diagnosis]
permissions:
  contents: read
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  default-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run browser -- tests/browser/${{ inputs.spec || 'performance' }}.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: default-performance, path: test-results/, retention-days: 2}
