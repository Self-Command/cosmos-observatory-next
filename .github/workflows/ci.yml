name: Native observatory verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/PROGRESS.md']
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx eslint src tests
      - run: npm test
      - name: Build once for every downstream test
        run: npm run build
      - run: node scripts/test-source-bridge.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-contract-evidence
          path: |
            test-results/source/
            test-results/settings/
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: immutable-build, path: dist/, retention-days: 2, if-no-files-found: error}
  browser:
    needs: quality-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: immutable-build, path: dist/}
      - run: node scripts/verify-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: browser-evidence, path: test-results/, retention-days: 2}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-visual-layout
          path: |
            test-results/**/*dashboard.png
            test-results/**/panel-*-maximized.png
            test-results/**/world-xyz-mouse-controls.png
            test-results/**/file-mouse-actions.png
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-visual-entries
          path: |
            test-results/**/*entry-*.png
            test-results/**/*file-sheet.png
            test-results/**/*search.png
            test-results/**/*select.png
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-visual-settings
          path: 'test-results/**/*settings-*.png'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-visual-evidence
          path: |
            test-results/**/events-full.png
            test-results/**/event-evidence.png
            test-results/**/coverage-*.png
            test-results/**/heat-cell-events.png
            test-results/**/*panel-menu.png
            test-results/**/panel-tooltip.png
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-metrics
          path: 'test-results/**/*.json'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mouse-graph-videos
          path: 'test-results/**/graph-interactions-*/video.webm'
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mouse-panels-video
          path: 'test-results/**/operations-*/video.webm'
          retention-days: 2
  host:
    needs: quality-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, version: '1.14.4', profile: core}
          - {os: windows-latest, version: '1.13.7', profile: core}
          - {os: ubuntu-latest, version: '1.14.4', profile: core}
          - {os: windows-latest, version: '1.14.4', profile: combination}
          - {os: ubuntu-latest, version: '1.14.4', profile: stress}
    runs-on: ${{ matrix.os }}
    env:
      OBSIDIAN_VERSION: ${{ matrix.version }}
      HOST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: immutable-build, path: dist/}
      - run: node scripts/verify-build.mjs
      - run: node scripts/fixtures.mjs
      - run: node scripts/plugin-combination.mjs
        if: matrix.profile == 'combination'
      - name: Install Linux host display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 ffmpeg fonts-noto-cjk
      - name: Verify native host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1600x1120x24" bash scripts/run-native-linux.sh
      - name: Verify native host (Windows)
        if: runner.os == 'Windows'
        run: npm run host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-${{ matrix.os }}-${{ matrix.version }}-${{ matrix.profile }}
          path: test-results/host/
          retention-days: 2
  performance:
    needs: quality-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {STRESS: 'true'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: immutable-build, path: dist/}
      - run: node scripts/verify-build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: performance-evidence, path: test-results/, retention-days: 2}
  gate:
    needs: [quality-build, browser, host, performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject any required failure or skip
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e "for(const [name,result] of Object.entries(JSON.parse(process.env.REQUIRED_RESULTS)))if(result.result!=='success')throw Error(name+': '+result.result)"
  review-build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: immutable-build, path: dist/}
      - run: npm run package
        env: {VERIFICATION_GATE: passed}
      - run: python scripts/verify-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-review-build-not-final-candidate
          path: |
            dist/cosmos-observatory-next.zip
            dist/SHA256SUMS
            dist/integrity.json
            dist/FILE-SHA256SUMS
            dist/CANDIDATE-VERIFICATION.json
          retention-days: 2
