name: Initialize locked frameworks
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate dependency lock in Actions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate pinned official component source and CosmoGraph adaptation
        run: node scripts/bootstrap.mjs
      - name: Commit generated framework source and lock
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add package-lock.json src/framework src/ui/official docs/shadcn-source.json docs/cosmograph-patches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Pin framework dependencies and official sources generated in Actions'
            git push
          fi
      - name: Dispatch verification on the generated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
